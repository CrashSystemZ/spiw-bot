<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-labelledby="t d">
  <title id="t">How spiw-bot is used</title>
  <desc id="d">A Telegram chat on a phone. The user types the bot's name and a link, taps the card that appears, the card is sent as a placeholder and turns into the post's photo, and the arrows under it page through the post.</desc>
  <defs>
    <clipPath id="frame"><rect width="880" height="620" rx="24"/></clipPath>
    <clipPath id="screen"><rect x="272" y="42" width="336" height="600" rx="44"/></clipPath>
    <clipPath id="field"><rect x="336" y="513" width="214" height="30"/></clipPath>
    <clipPath id="media"><rect width="202" height="220" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f8fd6"/><stop offset=".5" stop-color="#1f56d2"/><stop offset="1" stop-color="#4a2cb8"/></linearGradient>
    <radialGradient id="teal"><stop offset="0" stop-color="#22e0c8" stop-opacity=".85"/><stop offset="1" stop-color="#22e0c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#9a4bff" stop-opacity=".8"/><stop offset="1" stop-color="#9a4bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sky"><stop offset="0" stop-color="#3fc1ff" stop-opacity=".75"/><stop offset="1" stop-color="#3fc1ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8f99"/><stop offset=".5" stop-color="#3a3d44"/><stop offset="1" stop-color="#6b6f78"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14252f"/><stop offset="1" stop-color="#0c171f"/></linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a4c"/><stop offset="1" stop-color="#d6409f"/></linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2aabee"/><stop offset="1" stop-color="#6d5ae6"/></linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff5e8a"/><stop offset="1" stop-color="#8a3ff0"/></linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d33"/><stop offset=".6" stop-color="#1d5a7a"/><stop offset="1" stop-color="#3fb6c9"/></linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160c3a"/><stop offset=".6" stop-color="#6a1b9a"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>
    <path id="read" d="M0 4 3 7 9 0M5 6 6 7 12 0" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="ring"><circle r="23" fill="#e8f1fa" fill-opacity=".3" stroke="#fff" stroke-opacity=".8" stroke-width="2.5"/></g>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .d1{animation:d1 16s ease-in-out infinite alternate}
    .d2{animation:d2 20s ease-in-out infinite alternate}
    .d3{animation:d3 24s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(120px,60px)}}
    @keyframes d2{to{transform:translate(-110px,-70px)}}
    @keyframes d3{to{transform:translate(90px,-80px)}}
    /* one 16 s loop: type 3-17 %, card 18-27 %, placeholder 27-44 %, media 44-97 %, pages at 63 % and 81 % */
    .a{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
    /* earlier messages sit above the input and move up as new ones arrive, as in a real chat */
    .hist{animation-name:hist}
    @keyframes hist{0%,18%{transform:translateY(264px)}20%,27%{transform:translateY(190px)}29.5%,43.5%{transform:translateY(166px)}46.5%,97%{transform:translateY(0)}99%,100%{transform:translateY(264px)}}
    .hint{animation-name:hint}
    @keyframes hint{0%,2.9%{opacity:1}3%,26.9%{opacity:0}27%,100%{opacity:1}}
    .typed{opacity:0;animation-name:typed}
    @keyframes typed{0%,2.9%{opacity:0}3%,26.5%{opacity:1}27%,100%{opacity:0}}
    .cover{animation-name:cover}
    @keyframes cover{0%,3%{transform:translateX(0);animation-timing-function:linear}17%,100%{transform:translateX(210px)}}
    .caret{animation:blink 1s linear infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .panel{opacity:0;animation-name:panel}
    @keyframes panel{0%,18%{opacity:0;transform:translateY(16px)}20.5%,26%{opacity:1;transform:translateY(0)}27.5%,100%{opacity:0;transform:translateY(16px)}}
    .tap{opacity:0}
    .tap1{animation-name:tap1}
    @keyframes tap1{0%,21.9%{opacity:0;transform:scale(.4)}23%{opacity:1;transform:scale(.8)}25%{opacity:1;transform:scale(1)}27%,100%{opacity:0;transform:scale(1.25)}}
    .tap2{animation-name:tap2}
    @keyframes tap2{0%,58.9%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(.8)}62%{opacity:1;transform:scale(1)}64%,76.9%{opacity:0;transform:scale(1.25)}77%{opacity:0;transform:scale(.4)}78%{opacity:1;transform:scale(.8)}80%{opacity:1;transform:scale(1)}82%,100%{opacity:0;transform:scale(1.25)}}
    .cook{opacity:0;animation-name:cook}
    @keyframes cook{0%,27%{opacity:0;transform:translateY(24px)}29.5%,43%{opacity:1;transform:translateY(0)}44%,100%{opacity:0;transform:translateY(0)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .media{animation-name:media}
    @keyframes media{0%,43.5%{opacity:0}46%,97%{opacity:1}99%,100%{opacity:0}}
    .p2{opacity:0;animation-name:p2}
    @keyframes p2{0%,62%{opacity:0}64.5%,100%{opacity:1}}
    .p3{opacity:0;animation-name:p3}
    @keyframes p3{0%,80%{opacity:0}82.5%,100%{opacity:1}}
    .c1{animation-name:c1}
    @keyframes c1{0%,62.9%{opacity:1}63%,100%{opacity:0}}
    .c2{opacity:0;animation-name:c2}
    @keyframes c2{0%,62.9%{opacity:0}63%,80.9%{opacity:1}81%,100%{opacity:0}}
    .c3{opacity:0;animation-name:c3}
    @keyframes c3{0%,80.9%{opacity:0}81%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- backdrop -->
  <g clip-path="url(#frame)">
    <rect width="880" height="620" fill="url(#bg)"/>
    <circle class="d1" cx="120" cy="40" r="330" fill="url(#teal)"/>
    <circle class="d2" cx="820" cy="520" r="380" fill="url(#violet)"/>
    <circle class="d3" cx="500" cy="700" r="320" fill="url(#sky)"/>
    <g transform="translate(440 30) scale(1.12) translate(-440 -30)">
    <rect x="272" y="60" width="336" height="600" rx="56" fill="#061033" fill-opacity=".55" filter="url(#shadow)"/>

    <!-- phone -->
    <rect x="257" y="150" width="4" height="26" rx="2" fill="#2a2d33"/>
    <rect x="257" y="196" width="4" height="50" rx="2" fill="#2a2d33"/>
    <rect x="257" y="258" width="4" height="50" rx="2" fill="#2a2d33"/>
    <rect x="619" y="214" width="4" height="78" rx="2" fill="#2a2d33"/>
    <rect x="260" y="30" width="360" height="620" rx="56" fill="url(#rim)"/>
    <rect x="262.5" y="32.5" width="355" height="615" rx="53.5" fill="#050608"/>

    <g clip-path="url(#screen)">
      <rect x="272" y="42" width="336" height="600" fill="url(#wall)"/>

      <!-- earlier messages -->
      <g class="a hist">
        <rect x="282" y="166" width="198" height="34" rx="17" fill="#1d2c39"/>
        <text x="296" y="188" font-size="14" fill="#fff">ok who has that post</text>
        <text x="468" y="190" font-size="10.5" fill="#7f93a5" text-anchor="end">21:04</text>
        <rect x="282" y="204" width="142" height="34" rx="17" fill="#1d2c39"/>
        <path d="M294 238h-19c5-2 7-7 7-14h12Z" fill="#1d2c39"/>
        <text x="296" y="226" font-size="14" fill="#fff">send it here</text>
        <text x="412" y="228" font-size="10.5" fill="#7f93a5" text-anchor="end">21:04</text>
      </g>

      <!-- the placeholder that was sent -->
      <g class="a cook">
        <rect x="396" y="412" width="202" height="54" rx="17" fill="#3a6f9c"/>
        <path d="M586 466h19c-5-2-7-7-7-14h-12Z" fill="#3a6f9c"/>
        <text x="410" y="432" font-size="12" font-weight="600" fill="#b5ddff">via @spiwbot</text>
        <circle class="spin" cx="417" cy="449" r="6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="22 16"/>
        <text x="431" y="454" font-size="14" fill="#fff">Cooking...</text>
        <text x="570" y="458" font-size="10.5" fill="#b9d4ea" text-anchor="end">21:05</text>
        <use href="#read" x="574" y="450" stroke="#dcecf9"/>
        <rect x="396" y="471" width="202" height="31" rx="10" fill="#fff" fill-opacity=".13"/>
        <text x="497" y="491.5" font-size="13" text-anchor="middle">📎</text>
        <path d="M586.5 481.5v-4h-4m4 0-4.5 4.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- the media it turns into -->
      <g class="a media">
        <g transform="translate(396 246)" clip-path="url(#media)">
          <g>
            <rect width="202" height="220" fill="url(#sky1)"/>
            <circle cx="101" cy="108" r="31" fill="#fff5c2" fill-opacity=".92"/>
            <path d="M0 150Q46 116 100 142T202 126V220H0Z" fill="#5a1f9c" fill-opacity=".8"/>
            <path d="M0 178Q62 146 120 170T202 160V220H0Z" fill="#2c0f5c"/>
          </g>
          <g class="a p2">
            <rect width="202" height="220" fill="url(#sky2)"/>
            <circle cx="150" cy="52" r="16" fill="#f4f7fb"/>
            <circle cx="143" cy="46" r="14.5" fill="#0d2238"/>
            <path d="M0 158Q25 148 50 158T100 158T150 158T200 158T250 158V220H0Z" fill="#7fd8e6" fill-opacity=".45"/>
            <path d="M0 176Q30 166 60 176T120 176T180 176T240 176V220H0Z" fill="#0d3b55" fill-opacity=".85"/>
            <path d="M78 164l20-42v42Z" fill="#fff"/><path d="M100 164v-32l16 32Z" fill="#dbe9f2"/>
            <path d="M70 166h54l-8 10H78Z" fill="#f7632a"/>
          </g>
          <g class="a p3">
            <rect width="202" height="220" fill="url(#sky3)"/>
            <circle cx="40" cy="40" r="2" fill="#fff"/><circle cx="96" cy="24" r="1.5" fill="#fff"/><circle cx="166" cy="36" r="2" fill="#fff"/><circle cx="132" cy="66" r="1.5" fill="#fff"/><circle cx="62" cy="84" r="1.5" fill="#fff"/>
            <path d="M0 220v-60h24v-20h22v36h18v-60h30v46h20v-28h24v46h20v-70h26v54h18v96Z" fill="#0b0620" fill-opacity=".93"/>
            <g fill="#ffd166"><rect x="71" y="126" width="5" height="6"/><rect x="82" y="126" width="5" height="6"/><rect x="71" y="140" width="5" height="6"/><rect x="165" y="100" width="5" height="6"/><rect x="175" y="116" width="5" height="6"/><rect x="165" y="132" width="5" height="6"/><rect x="31" y="150" width="5" height="6"/><rect x="121" y="148" width="5" height="6"/></g>
          </g>
        </g>
        <rect x="404" y="254" width="88" height="20" rx="10" fill="#000" fill-opacity=".45"/>
        <text x="448" y="268" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">via @spiwbot</text>
        <rect x="528" y="440" width="62" height="18" rx="9" fill="#000" fill-opacity=".45"/>
        <text x="565" y="453" font-size="10.5" fill="#fff" text-anchor="end">21:05</text>
        <use href="#read" x="569" y="445.5" stroke="#fff"/>
        <rect x="396" y="471" width="64" height="31" rx="10" fill="#fff" fill-opacity=".13"/>
        <rect x="465" y="471" width="64" height="31" rx="10" fill="#fff" fill-opacity=".13"/>
        <rect x="534" y="471" width="64" height="31" rx="10" fill="#fff" fill-opacity=".13"/>
        <path d="M433.5 486.5h-11m4-4.5-4.5 4.5 4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M560.5 486.5h11m-4-4.5 4.5 4.5-4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="a c1" x="497" y="491" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">1/5</text>
        <text class="a c2" x="497" y="491" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">2/5</text>
        <text class="a c3" x="497" y="491" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">3/5</text>
      </g>

      <!-- top bar, over anything that scrolls under it -->
      <rect x="272" y="42" width="336" height="94" fill="#12232d" fill-opacity=".9"/>
      <text x="318" y="72" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">9:41</text>
      <g fill="#fff">
        <rect x="531" y="67" width="3" height="4.5" rx=".8"/><rect x="535.5" y="65" width="3" height="6.5" rx=".8"/><rect x="540" y="63" width="3" height="8.5" rx=".8"/><rect x="544.5" y="60.5" width="3" height="11" rx=".8"/>
        <circle cx="560" cy="70" r="1.5"/>
        <rect x="572" y="60.5" width="22" height="11" rx="3.5"/><rect x="595" y="64" width="1.6" height="4" rx=".8" fill-opacity=".6"/>
      </g>
      <path d="M553 64.5a10 10 0 0 1 14 0M555.8 67.4a6 6 0 0 1 8.4 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="387" y="53" width="106" height="30" rx="15" fill="#000"/>
      <circle cx="298" cy="112" r="19" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
      <path d="M301.5 105l-7 7 7 7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="378" y="93" width="124" height="38" rx="19" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
      <text x="440" y="109.5" font-size="14.5" font-weight="600" fill="#fff" text-anchor="middle">Mia</text>
      <text x="440" y="123" font-size="10" fill="#8fa0b0" text-anchor="middle">last seen just now</text>
      <circle cx="582" cy="112" r="18" fill="url(#avatar)"/>
      <text x="582" y="117" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">M</text>

      <!-- inline results -->
      <g class="a panel">
        <rect x="282.5" y="436.5" width="315" height="66" rx="20" fill="#16232d" stroke="#fff" stroke-opacity=".16"/>
        <rect x="292" y="446" width="46" height="46" rx="12" fill="url(#thumb)"/>
        <path d="M315 478v-18m-7.5 7.5 7.5-8 7.5 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="350" y="466" font-size="14.5" font-weight="600" fill="#fff">Click to send</text>
        <text x="350" y="484" font-size="12" fill="#8090a0">vm.tiktok.com</text>
      </g>

      <!-- input -->
      <circle cx="298" cy="528" r="17" fill="#16232d" stroke="#fff" stroke-opacity=".16"/>
      <g transform="translate(298 528) rotate(45) translate(-12 -11)">
        <path d="M8 6v9a4 4 0 0 0 8 0V5a2.5 2.5 0 0 0-5 0v9.5a1 1 0 0 0 2 0V7" fill="none" stroke="#dfe7ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <rect x="322.5" y="511.5" width="235" height="33" rx="16.5" fill="#16232d" stroke="#fff" stroke-opacity=".16"/>
      <text class="a hint" x="338" y="533" font-size="14" fill="#7f8f9e">Message</text>
      <g class="a typed">
        <text x="338" y="533" font-size="13.5" fill="#fff" textLength="198" lengthAdjust="spacing">@spiwbot vm.tiktok.com/ZMh2k9q</text>
        <g clip-path="url(#field)">
          <g class="a cover">
            <rect x="338" y="515" width="220" height="26" fill="#16232d"/>
            <rect class="caret" x="339" y="519" width="1.6" height="18" rx=".8" fill="#6ab3f3"/>
          </g>
        </g>
      </g>
      <circle cx="582" cy="528" r="17" fill="#16232d" stroke="#fff" stroke-opacity=".16"/>
      <g transform="translate(582 528)" fill="none" stroke="#dfe7ee" stroke-width="1.6" stroke-linecap="round">
        <rect x="-3.5" y="-9.5" width="7" height="12.5" rx="3.5"/><path d="M-6.5-1.5a6.5 6.5 0 0 0 13 0M0 5v3.5"/>
      </g>

      <!-- taps -->
      <g transform="translate(440 469)"><use href="#ring" class="a tap tap1"/></g>
      <g transform="translate(566 486.5)"><use href="#ring" class="a tap tap2"/></g>
    </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="619" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
</svg>
