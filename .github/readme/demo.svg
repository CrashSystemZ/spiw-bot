<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 504" role="img" aria-labelledby="t d">
  <title id="t">How spiw-bot is used</title>
  <desc id="d">A Telegram chat. The user types the bot's name and a link, taps the card that appears, the card is sent as a placeholder and turns into the post's photo, and the arrows under it page through the post.</desc>
  <defs>
    <clipPath id="frame"><rect width="880" height="504" rx="24"/></clipPath>
    <clipPath id="win"><rect x="32" y="28" width="560" height="448" rx="14"/></clipPath>
    <clipPath id="field"><rect x="84" y="432" width="424" height="36"/></clipPath>
    <clipPath id="media"><rect x="326" y="200" width="250" height="180" rx="14"/></clipPath>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#2aabee" stop-opacity=".3"/><stop offset="1" stop-color="#2aabee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowOrange"><stop offset="0" stop-color="#f7632a" stop-opacity=".22"/><stop offset="1" stop-color="#f7632a" stop-opacity="0"/></radialGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2aabee"/><stop offset="1" stop-color="#6d5ae6"/></linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff5e8a"/><stop offset="1" stop-color="#8a3ff0"/></linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d33"/><stop offset=".6" stop-color="#1d5a7a"/><stop offset="1" stop-color="#3fb6c9"/></linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160c3a"/><stop offset=".6" stop-color="#6a1b9a"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".05"/></pattern>
    <path id="read" d="M0 4 3 7 9 0M5 6 6 7 12 0" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    /* one 16 s loop: type 3-17 %, card 18-27 %, placeholder 27-44 %, media 44-97 %, pages at 63 % and 81 % */
    .a{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:ease-out}
    /* earlier messages sit above the input and move up as new ones arrive, as in a real chat */
    .hist{animation-name:hist}
    @keyframes hist{0%,18%{transform:translateY(222px)}20%,27%{transform:translateY(150px)}29%,43.5%{transform:translateY(128px)}46%,97%{transform:translateY(0)}99%,100%{transform:translateY(222px)}}
    .hint{animation-name:hint}
    @keyframes hint{0%,2.9%{opacity:1}3%,26.9%{opacity:0}27%,100%{opacity:1}}
    .typed{opacity:0;animation-name:typed}
    @keyframes typed{0%,2.9%{opacity:0}3%,26.5%{opacity:1}27%,100%{opacity:0}}
    .cover{animation-name:cover}
    @keyframes cover{0%,3%{transform:translateX(0);animation-timing-function:linear}17%,100%{transform:translateX(280px)}}
    .caret{animation:blink 1s linear infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .panel{opacity:0;animation-name:panel}
    @keyframes panel{0%,18%{opacity:0;transform:translateY(14px)}20%,26%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(14px)}}
    .tap{opacity:0}
    .tap1{animation-name:tap1}
    @keyframes tap1{0%,22.9%{opacity:0;transform:scale(.3)}23%{opacity:.55;transform:scale(.3)}26.5%,100%{opacity:0;transform:scale(1.7)}}
    .tap2{animation-name:tap2}
    @keyframes tap2{0%,59.9%{opacity:0;transform:scale(.3)}60%{opacity:.6;transform:scale(.3)}63.5%,77.9%{opacity:0;transform:scale(1.7)}78%{opacity:.6;transform:scale(.3)}81.5%,100%{opacity:0;transform:scale(1.7)}}
    .cook{opacity:0;animation-name:cook}
    @keyframes cook{0%,27%{opacity:0;transform:translateY(10px)}29%,43%{opacity:1;transform:translateY(0)}44%,100%{opacity:0;transform:translateY(0)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .media{animation-name:media}
    @keyframes media{0%,43.5%{opacity:0}46%,97%{opacity:1}99%,100%{opacity:0}}
    .p2{opacity:0;animation-name:p2}
    @keyframes p2{0%,62%{opacity:0}64.5%,100%{opacity:1}}
    .p3{opacity:0;animation-name:p3}
    @keyframes p3{0%,80%{opacity:0}82.5%,100%{opacity:1}}
    .c1{animation-name:c1}
    @keyframes c1{0%,62.9%{opacity:1}63%,100%{opacity:0}}
    .c2{opacity:0;animation-name:c2}
    @keyframes c2{0%,62.9%{opacity:0}63%,80.9%{opacity:1}81%,100%{opacity:0}}
    .c3{opacity:0;animation-name:c3}
    @keyframes c3{0%,80.9%{opacity:0}81%,100%{opacity:1}}
    .mic{animation-name:hint}
    .send{opacity:0;animation-name:typed}
    .s{opacity:0}
    .s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
    @keyframes s1{0%,2.9%{opacity:0}3.5%,17.5%{opacity:1}18%,100%{opacity:0}}
    @keyframes s2{0%,17.9%{opacity:0}18.5%,26.5%{opacity:1}27%,100%{opacity:0}}
    @keyframes s3{0%,26.9%{opacity:0}27.5%,59.5%{opacity:1}60%,100%{opacity:0}}
    @keyframes s4{0%,59.9%{opacity:0}60.5%,97%{opacity:1}98%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="880" height="504" fill="#090c13"/>
    <circle cx="60" cy="504" r="320" fill="url(#glowBlue)"/>
    <circle cx="860" cy="0" r="320" fill="url(#glowOrange)"/>
    <rect width="880" height="504" fill="url(#dots)"/>
  </g>
  <rect x=".5" y=".5" width="879" height="503" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".1"/>

  <!-- chat window -->
  <g clip-path="url(#win)">
    <rect x="32" y="28" width="560" height="448" fill="#0e1621"/>

    <!-- earlier messages -->
    <g class="a hist">
      <rect x="48" y="120" width="204" height="34" rx="17" fill="#1b2634"/>
      <text x="62" y="142" font-size="13.5" fill="#f1f4f7">ok who has that post</text>
      <text x="239" y="144" font-size="11" fill="#6b7b8c" text-anchor="end">21:04</text>
      <rect x="48" y="158" width="146" height="34" rx="17" fill="#1b2634"/>
      <path d="M60 192H41c5-2 7-7 7-14h12Z" fill="#1b2634"/>
      <text x="62" y="180" font-size="13.5" fill="#f1f4f7">send it here</text>
      <text x="181" y="182" font-size="11" fill="#6b7b8c" text-anchor="end">21:04</text>
    </g>

    <!-- the placeholder that was sent -->
    <g class="a cook">
      <rect x="326" y="328" width="250" height="52" rx="16" fill="#385177"/>
      <path d="M564 380h19c-5-2-7-7-7-14h-12Z" fill="#385177"/>
      <text x="340" y="347" font-size="12" font-weight="600" fill="#8fd0ff">via @spiw_bot</text>
      <circle class="spin" cx="347" cy="364" r="6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="22 16"/>
      <text x="361" y="369" font-size="13.5" fill="#fff">Cooking...</text>
      <text x="546" y="372" font-size="11" fill="#8fb2da" text-anchor="end">21:05</text>
      <use href="#read" x="551" y="364" stroke="#7cc0f8"/>
      <rect x="326" y="384" width="250" height="30" rx="7" fill="#fff" fill-opacity=".1"/>
      <text x="451" y="404" font-size="13" text-anchor="middle">📎</text>
    </g>

    <!-- the media it turns into -->
    <g class="a media">
      <g clip-path="url(#media)">
        <g transform="translate(0 82)">
          <g>
            <rect x="326" y="118" width="250" height="180" fill="url(#sky1)"/>
            <circle cx="470" cy="206" r="34" fill="#fff5c2" fill-opacity=".92"/>
            <path d="M326 250Q380 214 440 244T576 226V298H326Z" fill="#5a1f9c" fill-opacity=".8"/>
            <path d="M326 276Q400 240 470 268T576 258V298H326Z" fill="#2c0f5c"/>
          </g>
          <g class="a p2">
            <rect x="326" y="118" width="250" height="180" fill="url(#sky2)"/>
            <circle cx="516" cy="160" r="18" fill="#f4f7fb"/>
            <circle cx="508" cy="154" r="16" fill="#102742"/>
            <path d="M326 244Q360 232 394 244T462 244T530 244T598 244V298H326Z" fill="#7fd8e6" fill-opacity=".45"/>
            <path d="M326 262Q366 250 406 262T486 262T566 262T646 262V298H326Z" fill="#0d3b55" fill-opacity=".85"/>
            <path d="M400 248l22-44v44Z" fill="#fff"/><path d="M424 248v-34l18 34Z" fill="#dbe9f2"/>
            <path d="M392 250h56l-8 10h-40Z" fill="#f7632a"/>
          </g>
          <g class="a p3">
            <rect x="326" y="118" width="250" height="180" fill="url(#sky3)"/>
            <circle cx="386" cy="158" r="2" fill="#fff"/><circle cx="446" cy="140" r="1.5" fill="#fff"/><circle cx="530" cy="150" r="2" fill="#fff"/><circle cx="492" cy="176" r="1.5" fill="#fff"/>
            <path d="M326 298V236h30v-22h26v40h20v-66h34v50h22v-30h28v52h24v-78h30v60h36v96Z" fill="#0b0620" fill-opacity=".93"/>
            <g fill="#ffd166"><rect x="410" y="198" width="5" height="6"/><rect x="421" y="198" width="5" height="6"/><rect x="410" y="212" width="5" height="6"/><rect x="518" y="174" width="5" height="6"/><rect x="528" y="190" width="5" height="6"/><rect x="518" y="206" width="5" height="6"/><rect x="364" y="226" width="5" height="6"/><rect x="466" y="222" width="5" height="6"/></g>
          </g>
        </g>
      </g>
      <rect x="334" y="208" width="94" height="20" rx="10" fill="#000" fill-opacity=".45"/>
      <text x="381" y="222" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">via @spiw_bot</text>
      <rect x="506" y="354" width="62" height="18" rx="9" fill="#000" fill-opacity=".45"/>
      <text x="543" y="367" font-size="10.5" fill="#fff" text-anchor="end">21:05</text>
      <use href="#read" x="547" y="359.5" stroke="#fff"/>
      <rect x="326" y="384" width="80" height="30" rx="7" fill="#fff" fill-opacity=".1"/>
      <rect x="411" y="384" width="80" height="30" rx="7" fill="#fff" fill-opacity=".1"/>
      <rect x="496" y="384" width="80" height="30" rx="7" fill="#fff" fill-opacity=".1"/>
      <path d="M371 399h-11m4-4.5-4.5 4.5 4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 399h11m-4-4.5 4.5 4.5-4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="a c1" x="451" y="403.5" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">1/5</text>
      <text class="a c2" x="451" y="403.5" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">2/5</text>
      <text class="a c3" x="451" y="403.5" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">3/5</text>
      <g transform="translate(536 399)"><circle class="a tap tap2" r="20" fill="#fff"/></g>
    </g>

    <!-- header, over anything that scrolls under it -->
    <rect x="32" y="28" width="560" height="52" fill="#17212b"/>
    <rect x="32" y="80" width="560" height="1" fill="#0a0f16"/>
    <text x="50" y="51" font-size="14.5" font-weight="600" fill="#fff">Mia</text>
    <text x="50" y="68" font-size="12" fill="#6b7b8c">last seen recently</text>
    <g fill="none" stroke="#6b7b8c" stroke-width="1.8" stroke-linecap="round">
      <circle cx="524" cy="52" r="6.5"/><path d="M529 57l5 5"/>
    </g>
    <circle cx="566" cy="46" r="1.8" fill="#6b7b8c"/><circle cx="566" cy="54" r="1.8" fill="#6b7b8c"/><circle cx="566" cy="62" r="1.8" fill="#6b7b8c"/>

    <!-- inline results -->
    <g class="a panel">
      <rect x="32" y="356" width="560" height="68" fill="#17212b"/>
      <rect x="32" y="356" width="560" height="1" fill="#0a0f16"/>
      <rect x="40" y="362" width="544" height="56" rx="10" fill="#2aabee" fill-opacity=".12"/>
      <rect x="48" y="366" width="48" height="48" rx="10" fill="url(#thumb)"/>
      <path d="M72 400v-19m-8 8 8-8.5 8 8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="387" font-size="14" font-weight="600" fill="#fff">Click to send</text>
      <text x="110" y="405" font-size="12" fill="#6b7b8c">vm.tiktok.com</text>
      <g transform="translate(190 390)"><circle class="a tap tap1" r="24" fill="#fff"/></g>
    </g>

    <!-- input -->
    <rect x="32" y="424" width="560" height="52" fill="#17212b"/>
    <rect x="32" y="424" width="560" height="1" fill="#0a0f16"/>
    <g transform="translate(58 450) rotate(45) translate(-12 -11)">
      <path d="M8 6v9a4 4 0 0 0 8 0V5a2.5 2.5 0 0 0-5 0v9.5a1 1 0 0 0 2 0V7" fill="none" stroke="#6b7b8c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="a hint" x="86" y="454.5" font-size="13.5" fill="#5d6b7a">Write a message...</text>
    <g class="a typed">
      <text x="86" y="454.5" font-size="13.5" fill="#f1f4f7" textLength="280" lengthAdjust="spacing">@spiw_bot https://vm.tiktok.com/ZMh2k9q/</text>
      <g clip-path="url(#field)">
        <g class="a cover">
          <rect x="86" y="436" width="430" height="28" fill="#17212b"/>
          <rect class="caret" x="87" y="441" width="1.6" height="18" rx=".8" fill="#6ab3f3"/>
        </g>
      </g>
    </g>
    <g transform="translate(528 450)" fill="none" stroke="#6b7b8c" stroke-width="1.7" stroke-linecap="round">
      <circle r="9.5"/><path d="M-4.5 2.2a5 5 0 0 0 9 0"/>
      <circle cx="-3.2" cy="-2.6" r=".6"/><circle cx="3.2" cy="-2.6" r=".6"/>
    </g>
    <g class="a mic" transform="translate(566 450)" fill="none" stroke="#6b7b8c" stroke-width="1.7" stroke-linecap="round">
      <rect x="-3.5" y="-10" width="7" height="13" rx="3.5"/><path d="M-7-1a7 7 0 0 0 14 0M0 6v4"/>
    </g>
    <g class="a send"><path d="M557 441.500 577 450l-20 8.500 3.500-8.500Z" fill="#5b9be0"/></g>
  </g>
  <rect x="32.5" y="28.5" width="559" height="447" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".1"/>

  <!-- steps -->
  <text x="622" y="60" font-size="11" font-weight="700" fill="#8b98a9" textLength="104" lengthAdjust="spacing">ONE GESTURE</text>
  <g>
    <rect class="a s s1" x="612" y="86" width="240" height="64" rx="14" fill="#2aabee" fill-opacity=".14" stroke="#2aabee" stroke-opacity=".55"/>
    <circle cx="640" cy="118" r="13" fill="#1a2330" stroke="#fff" stroke-opacity=".12"/>
    <circle class="a s s1" cx="640" cy="118" r="13" fill="#2aabee"/>
    <text x="640" y="122.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="664" y="114" font-size="14.5" font-weight="650" fill="#f0f4f8">Paste a link</text>
    <text x="664" y="133" font-size="12.5" fill="#8b98a9">after the bot's name</text>
  </g>
  <g>
    <rect class="a s s2" x="612" y="180" width="240" height="64" rx="14" fill="#2aabee" fill-opacity=".14" stroke="#2aabee" stroke-opacity=".55"/>
    <circle cx="640" cy="212" r="13" fill="#1a2330" stroke="#fff" stroke-opacity=".12"/>
    <circle class="a s s2" cx="640" cy="212" r="13" fill="#2aabee"/>
    <text x="640" y="216.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="664" y="208" font-size="14.5" font-weight="650" fill="#f0f4f8">Tap the card</text>
    <text x="664" y="227" font-size="12.5" fill="#8b98a9">it goes out as a placeholder</text>
  </g>
  <g>
    <rect class="a s s3" x="612" y="274" width="240" height="64" rx="14" fill="#f7632a" fill-opacity=".14" stroke="#f7632a" stroke-opacity=".6"/>
    <circle cx="640" cy="306" r="13" fill="#1a2330" stroke="#fff" stroke-opacity=".12"/>
    <circle class="a s s3" cx="640" cy="306" r="13" fill="#f7632a"/>
    <text x="640" y="310.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="664" y="302" font-size="14.5" font-weight="650" fill="#f0f4f8">It becomes the post</text>
    <text x="664" y="321" font-size="12.5" fill="#8b98a9">fetched and uploaded once</text>
  </g>
  <g>
    <rect class="a s s4" x="612" y="368" width="240" height="64" rx="14" fill="#3fb950" fill-opacity=".13" stroke="#3fb950" stroke-opacity=".55"/>
    <circle cx="640" cy="400" r="13" fill="#1a2330" stroke="#fff" stroke-opacity=".12"/>
    <circle class="a s s4" cx="640" cy="400" r="13" fill="#2ea043"/>
    <text x="640" y="404.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="664" y="396" font-size="14.5" font-weight="650" fill="#f0f4f8">Page through it</text>
    <text x="664" y="415" font-size="12.5" fill="#8b98a9">when it has several files</text>
  </g>
</svg>
