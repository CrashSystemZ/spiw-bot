<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" role="img" aria-labelledby="t d">
  <title id="t">The jail spiw-bot runs in</title>
  <desc id="d">The bot and cobalt share one network namespace owned by a firewall sidecar. From inside, host services, private networks, cloud metadata and the host's own address are unreachable. Only outbound traffic to the public internet is allowed, and inbound connections are dropped.</desc>
  <defs>
    <clipPath id="frame"><rect width="880" height="424" rx="24"/></clipPath>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#2aabee" stop-opacity=".3"/><stop offset="1" stop-color="#2aabee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowRed"><stop offset="0" stop-color="#f85149" stop-opacity=".2"/><stop offset="1" stop-color="#f85149" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGreen"><stop offset="0" stop-color="#3fb950" stop-opacity=".2"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".05"/></pattern>
    <marker id="go" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 6.5 4 1 7" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="no">
      <circle r="10" fill="#1a0f12" stroke="#f85149" stroke-width="1.5"/>
      <path d="M-4-4 4 4M4-4-4 4" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .cap{font-size:10.5px;font-weight:700;letter-spacing:1.4px}
    .h{font-size:13.5px;font-weight:650;fill:#f0f4f8}
    .p{font-size:11px;fill:#9aa7b8}
    .bad{fill:#f85149;fill-opacity:.07;stroke:#f85149;stroke-opacity:.45}
    .ok{fill:#3fb950;fill-opacity:.08;stroke:#3fb950;stroke-opacity:.5}
    .in{fill:#0f1520;stroke:#fff;stroke-opacity:.14}
    .chip{fill:#fff;fill-opacity:.05;stroke:#fff;stroke-opacity:.14}
    .ct{font-size:10.5px;fill:#c3cfde}
    .deny{fill:none;stroke:#f85149;stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
    .allow{fill:none;stroke:#3fb950;stroke-width:1.8;stroke-dasharray:5 5;animation:allow 1s linear infinite}
    @keyframes allow{to{stroke-dashoffset:-20}}
    .x{animation:x 2.4s ease-in-out infinite}
    .x.b{animation-delay:-.6s}.x.c{animation-delay:-1.2s}.x.d{animation-delay:-1.8s}
    @keyframes x{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    .jail{fill:#2aabee;fill-opacity:.05;stroke:#2aabee;stroke-opacity:.7;stroke-width:1.5;stroke-dasharray:7 6;animation:jail 20s linear infinite}
    @keyframes jail{to{stroke-dashoffset:-260}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="880" height="424" fill="#090c13"/>
    <circle cx="440" cy="200" r="300" fill="url(#glowBlue)"/>
    <circle cx="40" cy="60" r="280" fill="url(#glowRed)"/>
    <circle cx="850" cy="80" r="260" fill="url(#glowGreen)"/>
    <rect width="880" height="424" fill="url(#dots)"/>
  </g>
  <rect x=".5" y=".5" width="879" height="423" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".1"/>

  <text class="cap" x="28" y="52" fill="#ff9d96">UNREACHABLE FROM INSIDE</text>
  <text class="cap" x="440" y="52" fill="#9fd8fb" text-anchor="middle">ONE NETWORK NAMESPACE</text>
  <text class="cap" x="852" y="52" fill="#8ee6a0" text-anchor="end">PUBLIC INTERNET</text>

  <!-- what the jail cannot reach -->
  <rect class="bad" x="28.5" y="72.5" width="190" height="58" rx="12"/>
  <text class="h" x="42" y="97">Host services</text>
  <text class="p" x="42" y="115">databases, SSH, admin panels</text>
  <rect class="bad" x="28.5" y="144.5" width="190" height="58" rx="12"/>
  <text class="h" x="42" y="169">Private networks</text>
  <text class="p" x="42" y="187">LAN, VPN, other containers</text>
  <rect class="bad" x="28.5" y="216.5" width="190" height="58" rx="12"/>
  <text class="h" x="42" y="241">Cloud metadata</text>
  <text class="p mono" x="42" y="259">169.254.169.254</text>
  <rect class="bad" x="28.5" y="288.5" width="190" height="58" rx="12"/>
  <text class="h" x="42" y="313">The host's own address</text>
  <text class="p" x="42" y="331">blocked by IP as well</text>

  <path class="deny" d="M300 101.5H220M300 173.5H220M300 245.5H220M300 317.5H220"/>
  <g transform="translate(260 101.5)"><use href="#no" class="x"/></g>
  <g transform="translate(260 173.5)"><use href="#no" class="x b"/></g>
  <g transform="translate(260 245.5)"><use href="#no" class="x c"/></g>
  <g transform="translate(260 317.5)"><use href="#no" class="x d"/></g>

  <!-- the jail -->
  <rect class="jail" x="300.5" y="66.5" width="279" height="286" rx="18"/>
  <rect class="in" x="318.5" y="84.5" width="243" height="78" rx="12"/>
  <text class="mono" x="332" y="108" font-size="15" font-weight="700" fill="#f0f4f8">fw</text>
  <rect x="478" y="94" width="72" height="20" rx="10" fill="#2aabee" fill-opacity=".16" stroke="#2aabee" stroke-opacity=".6"/>
  <text class="mono" x="514" y="108" font-size="10" fill="#9fd8fb" text-anchor="middle">NET_ADMIN</text>
  <text class="p"><tspan x="332" y="128">iptables: private ranges rejected,</tspan><tspan x="332" y="143">inbound dropped, IPv6 off.</tspan></text>
  <text class="p" x="332" y="156.5" fill="#6d7a8c">The others cannot change a rule.</text>

  <rect class="in" x="318.5" y="176.5" width="115" height="112" rx="12"/>
  <text class="mono" x="332" y="200" font-size="15" font-weight="700" fill="#ff9a62">cobalt</text>
  <text class="p"><tspan x="332" y="220">uid 10002</tspan><tspan x="332" y="236">loopback only</tspan><tspan x="332" y="252">API key required</tspan><tspan x="332" y="268">unused sites off</tspan></text>

  <rect class="in" x="446.5" y="176.5" width="115" height="112" rx="12"/>
  <text class="mono" x="460" y="200" font-size="15" font-weight="700" fill="#5cc3f5">bot</text>
  <text class="p"><tspan x="460" y="220">uid 10001</tspan><tspan x="460" y="236">FROM scratch</tspan><tspan x="460" y="252">no shell, no libc</tspan><tspan x="460" y="268">unsafe forbidden</tspan></text>

  <path d="M376 289v16h128v-16" fill="none" stroke="#8b98a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
  <rect x="388" y="295" width="104" height="20" rx="10" fill="#0d1420" stroke="#fff" stroke-opacity=".14"/>
  <text class="mono" x="440" y="309" font-size="10" fill="#c3cfde" text-anchor="middle">127.0.1:9000</text>
  <text class="p" x="440" y="337" text-anchor="middle" fill="#6d7a8c">they only ever meet on loopback</text>

  <!-- what it can reach -->
  <rect class="ok" x="661.5" y="72.5" width="190" height="58" rx="12"/>
  <text class="h" x="675" y="97">Telegram</text>
  <text class="p" x="675" y="115">MTProto, outbound</text>
  <rect class="ok" x="661.5" y="144.5" width="190" height="58" rx="12"/>
  <text class="h" x="675" y="169">TikTok · Instagram · X</text>
  <text class="p" x="675" y="187">through cobalt, outbound</text>
  <rect class="bad" x="661.5" y="288.5" width="190" height="58" rx="12"/>
  <text class="h" x="675" y="313">Inbound connections</text>
  <text class="p" x="675" y="331">dropped, no published ports</text>

  <path class="allow" d="M582 101.5h74" marker-end="url(#go)"/>
  <path class="allow" d="M582 173.5h74" marker-end="url(#go)"/>
  <path class="deny" d="M660 317.5H582"/>
  <g transform="translate(621 317.5)"><use href="#no" class="x b"/></g>

  <!-- hardening -->
  <g class="mono">
    <rect class="chip" x="46.4" y="376.5" width="96.8" height="24" rx="12"/><text class="ct" x="56.4" y="392.5" textLength="76.8">cap_drop ALL</text>
    <rect class="chip" x="151.2" y="376.5" width="109.6" height="24" rx="12"/><text class="ct" x="161.2" y="392.5" textLength="89.6">read-only root</text>
    <rect class="chip" x="268.8" y="376.5" width="128.8" height="24" rx="12"/><text class="ct" x="278.8" y="392.5" textLength="108.8">no-new-privileges</text>
    <rect class="chip" x="405.6" y="376.5" width="173.6" height="24" rx="12"/><text class="ct" x="415.6" y="392.5" textLength="153.6">pids, memory, CPU limits</text>
    <rect class="chip" x="587.2" y="376.5" width="109.6" height="24" rx="12"/><text class="ct" x="597.2" y="392.5" textLength="89.6">no docker.sock</text>
    <rect class="chip" x="704.8" y="376.5" width="128.8" height="24" rx="12"/><text class="ct" x="714.8" y="392.5" textLength="108.8">fail-closed start</text>
  </g>
</svg>
