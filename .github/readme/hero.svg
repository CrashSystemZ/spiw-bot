<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d">
  <title id="t">spiw-bot</title>
  <desc id="d">Paste a link. Send the video. A Telegram inline bot for TikTok, Instagram and X, written in Rust.</desc>
  <defs>
    <clipPath id="frame"><rect width="880" height="320" rx="24"/></clipPath>
    <clipPath id="cmd"><rect x="57" y="243" width="402" height="38" rx="19"/></clipPath>
    <clipPath id="front"><rect x="-72" y="-98" width="144" height="196" rx="20"/></clipPath>
    <clipPath id="side"><rect x="-60" y="-82" width="120" height="164" rx="18"/></clipPath>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#2aabee" stop-opacity=".55"/><stop offset="1" stop-color="#2aabee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowOrange"><stop offset="0" stop-color="#f7632a" stop-opacity=".5"/><stop offset="1" stop-color="#f7632a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPink"><stop offset="0" stop-color="#d6409f" stop-opacity=".32"/><stop offset="1" stop-color="#d6409f" stop-opacity="0"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c9eaff"/><stop offset="1" stop-color="#5cc3f5"/></linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2aabee"/><stop offset=".5" stop-color="#6d5ae6"/><stop offset="1" stop-color="#f7632a"/></linearGradient>
    <linearGradient id="cardPhoto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff5e8a"/><stop offset="1" stop-color="#8a3ff0"/></linearGradient>
    <linearGradient id="cardNight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101622"/><stop offset="1" stop-color="#1b1030"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern>
    <path id="spark" d="M0-7 1.7-1.7 7 0 1.7 1.7 0 7-1.7 1.7-7 0-1.7-1.7Z"/>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .d1{animation:d1 18s ease-in-out infinite alternate}
    .d2{animation:d2 22s ease-in-out infinite alternate}
    .d3{animation:d3 26s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(80px,50px)}}
    @keyframes d2{to{transform:translate(-90px,-60px)}}
    @keyframes d3{to{transform:translate(-60px,70px)}}
    .fl{animation:fl 6s ease-in-out infinite alternate}
    .fl.b{animation-duration:7.5s;animation-delay:-2s}
    .fl.c{animation-duration:9s;animation-delay:-4s}
    .fl.p{animation-duration:5s;animation-delay:-1s}
    @keyframes fl{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
    .ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}}
    .bar{transform-box:fill-box;transform-origin:left center;animation:bar 7s linear infinite}
    @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .cover{transform:translateX(336px);animation:type 9s infinite}
    @keyframes type{0%,5%{transform:translateX(0);animation-timing-function:steps(40,end)}40%,93%{transform:translateX(336px)}93.01%,100%{transform:translateX(0)}}
    .caret{animation:blink 1s linear infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .tw{animation:tw 3.2s ease-in-out infinite}
    .tw.b{animation-delay:-1.1s}.tw.c{animation-delay:-2.2s}
    @keyframes tw{0%,100%{transform:scale(.35);opacity:.15}50%{transform:scale(1);opacity:.95}}
    .dot{animation:dot 2s ease-in-out infinite}
    @keyframes dot{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="880" height="320" fill="#090c13"/>
    <circle class="d1" cx="110" cy="10" r="300" fill="url(#glowBlue)"/>
    <circle class="d2" cx="810" cy="340" r="310" fill="url(#glowOrange)"/>
    <circle class="d3" cx="560" cy="-50" r="230" fill="url(#glowPink)"/>
    <rect width="880" height="320" fill="url(#dots)"/>

    <!-- label -->
    <rect x="56" y="42" width="196" height="26" rx="13" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
    <circle class="dot" cx="72" cy="55" r="4" fill="#3fb950"/>
    <text x="84" y="59.5" font-size="11.5" font-weight="600" fill="#c3cfde" textLength="152" lengthAdjust="spacing">TELEGRAM INLINE BOT</text>

    <!-- wordmark -->
    <text x="52" y="170" font-size="112" font-weight="800" fill="url(#word)" textLength="232" lengthAdjust="spacingAndGlyphs">spiw</text>
    <text x="292" y="170" font-size="112" font-weight="200" fill="#fff" fill-opacity=".34" textLength="164" lengthAdjust="spacingAndGlyphs">bot</text>

    <text x="56" y="216" font-size="25" font-weight="650" fill="#eef3f8">Paste a link. Send the video.</text>

    <!-- command line -->
    <rect x="56.5" y="242.5" width="403" height="39" rx="19.5" fill="#0b1019" stroke="#fff" stroke-opacity=".14"/>
    <text class="mono" x="78" y="267" font-size="13.5" fill="#dbe4ee" textLength="336" lengthAdjust="spacingAndGlyphs"><tspan fill="#5cc3f5">@spiw_bot</tspan> https://vm.tiktok.com/ZMh2k9q/</text>
    <g clip-path="url(#cmd)">
      <g class="cover">
        <rect x="78" y="248" width="400" height="28" fill="#0b1019"/>
        <rect class="caret" x="79" y="253" width="2" height="18" rx="1" fill="#5cc3f5"/>
      </g>
    </g>

    <text class="mono" x="56" y="303" font-size="11" fill="#8b98a9">one static Rust binary · no ffmpeg · no yt-dlp · nothing on disk</text>

    <!-- paper plane -->
    <path d="M470 150c22-34 52-52 86-56" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
    <g transform="translate(556 70)"><g class="fl p">
      <path d="M0 13 36 0 28 32 17 22 11 29 11 19Z" fill="#fff"/>
      <path d="M11 19 36 0 17 22Z" fill="#bfe3f9"/>
    </g></g>

    <!-- sparkles -->
    <g transform="translate(498 218)"><use href="#spark" class="tw" fill="#fff"/></g>
    <g transform="translate(848 60)"><use href="#spark" class="tw b" fill="#ffd9c2"/></g>
    <g transform="translate(540 292)"><use href="#spark" class="tw c" fill="#bfe3f9"/></g>
    <g transform="translate(474 58) scale(.7)"><use href="#spark" class="tw b" fill="#fff"/></g>

    <!-- photo card -->
    <g transform="translate(590 174) rotate(-12)"><g class="fl b">
      <rect x="-60" y="-72" width="120" height="164" rx="18" fill="#000" fill-opacity=".28"/>
      <g clip-path="url(#side)">
        <rect x="-60" y="-82" width="120" height="164" fill="url(#cardPhoto)"/>
        <circle cx="-22" cy="-30" r="19" fill="#fff5c2" fill-opacity=".92"/>
        <path d="M-60 34Q-30 0 0 26T60 14V82H-60Z" fill="#5a1f9c" fill-opacity=".8"/>
        <path d="M-60 54Q-20 26 14 50T60 40V82H-60Z" fill="#2c0f5c"/>
      </g>
      <rect x="-60" y="-82" width="120" height="164" rx="18" fill="none" stroke="#fff" stroke-opacity=".28"/>
      <text x="-48" y="70" font-size="11" font-weight="700" fill="#fff">Instagram</text>
    </g></g>

    <!-- night card -->
    <g transform="translate(788 176) rotate(11)"><g class="fl c">
      <rect x="-60" y="-72" width="120" height="164" rx="18" fill="#000" fill-opacity=".28"/>
      <g clip-path="url(#side)">
        <rect x="-60" y="-82" width="120" height="164" fill="url(#cardNight)"/>
        <circle cx="19" cy="-16" r="21" fill="#25f4ee" fill-opacity=".9"/>
        <circle cx="29" cy="-9" r="21" fill="#fe2c55" fill-opacity=".9"/>
        <circle cx="24" cy="-12.5" r="19.5" fill="#fff"/>
        <path d="M18-22v19l15-9.5Z" fill="#101622"/>
      </g>
      <rect x="-60" y="-82" width="120" height="164" rx="18" fill="none" stroke="#fff" stroke-opacity=".22"/>
      <text x="48" y="70" font-size="11" font-weight="700" fill="#fff" text-anchor="end">TikTok</text>
    </g></g>

    <!-- video card -->
    <g transform="translate(686 160)"><g class="fl">
      <rect x="-72" y="-86" width="144" height="196" rx="20" fill="#000" fill-opacity=".34"/>
      <g clip-path="url(#front)">
        <rect x="-72" y="-98" width="144" height="196" fill="url(#cardFront)"/>
        <circle cx="-50" cy="-80" r="70" fill="#fff" fill-opacity=".1"/>
        <circle cx="60" cy="90" r="80" fill="#000" fill-opacity=".12"/>
      </g>
      <rect x="-72" y="-98" width="144" height="196" rx="20" fill="none" stroke="#fff" stroke-opacity=".4"/>
      <circle class="ring" r="29" fill="none" stroke="#fff" stroke-width="2"/>
      <circle r="29" fill="#fff" fill-opacity=".95"/>
      <path d="M-8-13v26l21-13Z" fill="#3b6fe0"/>
      <text x="-56" y="-74" font-size="11" font-weight="700" fill="#fff">X</text>
      <rect x="-56" y="72" width="112" height="4" rx="2" fill="#fff" fill-opacity=".3"/>
      <rect class="bar" x="-56" y="72" width="112" height="4" rx="2" fill="#fff"/>
      <text x="56" y="64" font-size="10" font-weight="600" fill="#fff" text-anchor="end">0:14</text>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="879" height="319" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
